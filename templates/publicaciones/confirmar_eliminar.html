{% extends 'base_private.html' %}

{% block title %}
Eliminar publicación | Be Time
{% endblock %}

{% block dashboard_content %}

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">

        <h1 class="h4 fw-bold mb-3">¿Eliminar esta publicación?</h1>

        <p class="text-muted mb-4">
            Vas a eliminar <strong>{{ publicacion.titulo }}</strong>. Esta acción no se puede deshacer.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                <a href="{% url 'publicaciones:panel_lista' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>

    </div>
</div>

{% endblock %}
