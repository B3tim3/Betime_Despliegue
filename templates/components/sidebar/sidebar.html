<div class="list-group">

    <a href="/" class="list-group-item list-group-item-action text-muted">
        <i class="bi bi-box-arrow-left"></i> Volver al sitio
    </a>

    <hr class="my-2">

    <a href="{% url 'usuarios:dashboard' %}" class="list-group-item list-group-item-action">
        <i class="bi bi-house"></i> Inicio
    </a>

    {% if request.user.personal_bienestar or request.user.administrador %}
        <a href="{% url 'eventos:panel_lista' %}" class="list-group-item list-group-item-action">
            <i class="bi bi-calendar-event"></i> Eventos
        </a>

        <a href="{% url 'publicaciones:panel_lista' %}" class="list-group-item list-group-item-action">
            <i class="bi bi-file-earmark-text"></i> Publicaciones
        </a>

        <a href="{% url 'bienestar:panel_nosotros' %}" class="list-group-item list-group-item-action">
            <i class="bi bi-people-fill"></i> Nosotros
        </a>

        <a href="{% url 'usuarios:fichas_lista' %}" class="list-group-item list-group-item-action">
            <i class="bi bi-journal-bookmark"></i> Fichas
        </a>

        <a href="{% url 'usuarios:aprendices_lista' %}" class="list-group-item list-group-item-action">
            <i class="bi bi-people"></i> Aprendices
        </a>
    {% endif %}

    {% if request.user.administrador %}
        <a href="{% url 'usuarios:crear_usuario' %}" class="list-group-item list-group-item-action">
            <i class="bi bi-person-plus"></i> Crear usuario
        </a>

        <a href="{% url 'usuarios:programas_lista' %}" class="list-group-item list-group-item-action">
            <i class="bi bi-mortarboard"></i> Programas de formación
        </a>

        <a href="{% url 'usuarios:jornadas_lista' %}" class="list-group-item list-group-item-action">
            <i class="bi bi-clock-history"></i> Jornadas
        </a>
    {% endif %}

</div>
