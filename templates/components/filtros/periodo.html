<!-- Selector de año para los paneles. Requiere en el contexto: periodo y opciones_periodo
     (los agrega PeriodoListMixin o la vista). Si no hay años anteriores con datos,
     el selector no se muestra (solo habría "vigente" y "todos"). Cambiar la opción recarga la lista (GET). -->
{% if opciones_periodo|length > 2 %}
<form method="get" class="d-flex align-items-center gap-2 flex-wrap mb-3" id="filtro-periodo">
    <label for="periodo" class="small text-muted mb-0"><i class="bi bi-calendar3"></i> Año:</label>
    <select name="periodo" id="periodo" class="form-select form-select-sm w-auto" onchange="this.form.submit()">
        {% for clave, etiqueta in opciones_periodo %}
            <option value="{{ clave }}" {% if clave == periodo.clave %}selected{% endif %}>{{ etiqueta }}</option>
        {% endfor %}
    </select>
    <noscript><button type="submit" class="btn btn-sm btn-outline-secondary">Ver</button></noscript>
    {% if periodo.clave == 'vigente' %}
        <span class="small text-muted">Mostrando {{ periodo.etiqueta }} y lo que viene. Elige otro año o «Todos los años» para ver el historial.</span>
    {% endif %}
</form>
{% endif %}
